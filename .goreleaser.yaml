version: 2

project_name: nitui

before:
  hooks:
    - go mod tidy

builds:
  - id: nitui
    main: ./cmd/nitui
    binary: nitui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # 32-bit ARM only makes sense for Linux (e.g. Raspberry Pi Zero/2/3);
      # neither Windows nor macOS ship on 32-bit ARM today.
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  prerelease: auto

winget:
  - name: nitui
    ids:
      - default
    publisher: ShifuRain
    package_identifier: ShifuRain.nitui
    short_description: "CLI and TUI for controlling Nitrado game servers"
    license: MIT
    license_url: "https://github.com/ShifuRain/Nitrado-TUI/blob/master/LICENSE"
    publisher_url: "https://github.com/ShifuRain"
    publisher_support_url: "https://github.com/ShifuRain/Nitrado-TUI/issues"
    homepage: "https://github.com/ShifuRain/Nitrado-TUI"
    copyright: "Nicklas Hoppe"
    author: "Nicklas Hoppe"
    tags:
      - cli
      - tui
      - nitrado
      - gameserver
    release_notes: "{{ .Changelog }}"
    # Renders "true" (skip) until WINGET_GITHUB_TOKEN is actually set as a
    # repo secret, so this pipe is a no-op rather than a hard failure for
    # anyone building/releasing before that setup is done.
    skip_upload: '{{ not (isEnvSet "WINGET_GITHUB_TOKEN") }}'
    repository:
      owner: ShifuRain
      name: winget-pkgs
      branch: "nitui-{{ .Version }}"
      # Plain .Env access is safe here: release.yml always declares this key
      # in its env block (as an empty string when the secret is unset), so
      # the map lookup itself never fails — only isEnvSet above needs to be
      # used for the skip decision.
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

aurs:
  - name: nitui-bin
    ids:
      - default
    homepage: "https://github.com/ShifuRain/Nitrado-TUI"
    description: "CLI and TUI for controlling Nitrado game servers"
    maintainers:
      - "Nicklas Hoppe <nicklas@hoppe.cloud>"
    license: "MIT"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/nitui-bin.git"
    provides:
      - nitui
    conflicts:
      - nitui
    # Same no-op-until-configured guard as winget above.
    skip_upload: '{{ not (isEnvSet "AUR_KEY") }}'
    package: |-
      install -Dm755 "./nitui" "${pkgdir}/usr/bin/nitui"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
    commit_author:
      name: goreleaserbot
      email: nicklas@hoppe.cloud
